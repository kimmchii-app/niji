name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate image index
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const imageRoot = 'images';
          const supported = new Set(['.jpg', '.jpeg', '.png', '.webp', '.gif', '.avif']);
          const files = [];

          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                walk(fullPath);
              } else if (supported.has(path.extname(entry.name).toLowerCase())) {
                files.push(fullPath.split(path.sep).join('/'));
              }
            }
          }

          if (fs.existsSync(imageRoot)) walk(imageRoot);
          files.sort((a, b) => a.localeCompare(b));

          const output = [
            '/* Generated by GitHub Actions. Do not edit manually. */',
            `window.IMAGE_FILES = ${JSON.stringify(files, null, 2)};`,
            ''
          ].join('\n');

          fs.writeFileSync('js/image-index.js', output, 'utf8');
          console.log(`Image index generated: ${files.length} file(s)`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
